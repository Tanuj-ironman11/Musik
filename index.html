<!DOCTYPE html>
<html lang="en">
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js"
      }
    }
  </script>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' file: data: blob:;
             script-src 'self' file:;
             style-src 'self' file: 'unsafe-inline';
             img-src 'self' file: data: blob: https:;
             media-src 'self' file: blob: https:;
             connect-src 'self' https:;
             font-src 'self' file: data:;"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Musik</title>

  <!-- Preconnect to the external APIs contacted at runtime, so the first
       scrobble/lyrics/art lookup skips DNS and TLS setup. Lyrica's fallback
       domain isn't confirmed yet, so it's not listed. -->
  <link rel="preconnect" href="https://ws.audioscrobbler.com" />
  <link rel="preconnect" href="https://lrclib.net" />
  <link rel="preconnect" href="https://musicbrainz.org" />
  <link rel="preconnect" href="https://coverartarchive.org" />
  <link rel="preconnect" href="https://api.acoustid.org" />

  <!-- CSS is split by role, do not merge these -->
  <link rel="stylesheet" href="src/styles/components.css" />
  <link rel="stylesheet" href="src/styles/context-menu.css" />

  <!-- Mod CSS is injected here at runtime by the mod loader -->
  <style id="mod-css-injection-point"></style>

  <!-- Boot splash. Uses CSS variables so themes and mods style it instantly -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg, #080808);
      pointer-events: none;
      animation: boot-splash-fade 220ms ease-out 900ms forwards;
    }
    #boot-splash span {
      font-family: "Space Mono", monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.14em;
      color: var(--color-text-dim, rgba(240, 240, 240, 0.45));
      animation: boot-splash-pulse 1100ms ease-in-out infinite;
    }
    @keyframes boot-splash-fade {
      to { opacity: 0; visibility: hidden; }
    }
    @keyframes boot-splash-pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash span { animation: none; opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div id="boot-splash" aria-hidden="true"><span>MUSIK</span></div>

  <div id="titlebar" role="banner"></div>
  <div id="app">
    <nav id="sidebar" aria-label="Main navigation"></nav>
    <main id="main" role="main"></main>
    <div id="now-playing-bar" role="region" aria-label="Now playing"></div>
  </div>

  <!-- Screen-reader-only live region for announcing track changes without
       visual clutter. TODO: player-ui.js/player-bar.js should push
       "{title} by {artist}" here on trackupdate. Not wired yet, since the exact
       event payload shape needs checking first. -->
  <div id="sr-announcer" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;"></div>

  <!-- Mod injection point for elements added via window.Musik.ui.injectElement -->
  <div id="mod-root"></div>

  <!--
    IMPORTANT: src/core/*.js (audio-engine.js, library.js, art-provider.js,
    mod-loader.js, queue-manager.js, lyrics.js, scrobbler.js) are CommonJS
    main-process modules. main.js loads them with require() and the renderer
    reaches them only through the window.Musik / window.Aurelius IPC bridge
    from preload.js.

    Never add them here as <script src> tags. With contextIsolation on and
    nodeIntegration off, `module` is undefined in the renderer, so the file
    throws immediately and silently kills every script after it in load
    order (this is why player-ui.js once never ran).

    Renderer-side scripts only below. All use `defer`: execution order is
    still document order, but the browser can fetch and parse them in
    parallel.
  -->
  <!-- input.js = MusikKeys registry + OS media session (replaces the old
       media-session.js, which no longer exists). Loads first so MusikKeys exists
       before any handler registers on it; the media half only does lazy lookups,
       so its order doesn't matter. -->
  <script src="src/ui/input.js" defer></script>
  <script src="src/ui/chrome.js" defer></script>
  <script src="src/ui/dialog.js" defer></script>
  <script src="src/ui/context-menu.js" defer></script>
  <script src="src/ui/marquee.js" defer></script>
  <script src="src/ui/views/home.js" defer></script>
  <script src="src/ui/views/library.js" defer></script>
  <script src="src/ui/views/system-check.js" defer></script>
  <script src="src/ui/views/settings.js" defer></script>
  <script src="src/ui/views/prefs.js" defer></script>
  <script src="src/ui/views/profile.js" defer></script>
  <script src="src/ui/app.js" defer></script>
  <script src="src/ui/player-ui.js" defer></script>
  <script src="src/ui/eq.js" defer></script>
  <script src="src/ui/eq-presets.local.js" defer></script>
  <!-- three.js comes from the importmap above as an ES module; the UMD
       build/three.min.js is gone as of r160+. This external shim re-exposes THREE
       as a global so the classic scripts below that expect window.THREE keep
       working. It must be external because the CSP's script-src has no
       'unsafe-inline'. Module scripts run in the same document-order queue as
       deferred ones, so it still runs before fullscreen.js, visualizer.js and
       accent-extractor.js. Source: src/ui/three-loader.js. -->
  <script type="module" src="src/ui/three-loader.js"></script>
  <script src="src/ui/fullscreen.js" defer></script>
  <script src="src/ui/visualizer.js" defer></script>
  <script src="src/ui/accent-extractor.js" defer></script>
  <script src="src/ui/player-bar.js" defer></script>
  <script src="src/ui/queue-panel.js" defer></script>
  <script src="src/ui/search.js" defer></script>

  <!-- Mod injection sanitization + runtime. DOMPurify must load first; defer
       preserves the order. It comes from npm (dompurify@3.4.15) like three.js and
       ships the same way (node_modules/**/* is already in electron-builder's
       files array). The integrity hash was generated from the installed file. -->
  <script src="node_modules/dompurify/dist/purify.min.js" integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL" defer></script>
  <script src="src/ui/mod-runtime.js" defer></script>

</body>
</html>
